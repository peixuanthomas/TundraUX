name: Publish V2.0.0 release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-v2.0.0
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_REF: ${{ github.sha }}
  RELEASE_TAG: v2.0.0

jobs:
  validate:
    name: Validate release source and version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - name: Verify release tag matches the build commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')" = "$RELEASE_REF"
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Require master and consistent package versions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/master
          cargo metadata --locked --no-deps --format-version 1 > metadata.json
          jq -e '.workspace_members as $members | [.packages[] | select(.id as $id | $members | index($id))] | length > 0 and all(.[]; .version == "2.0.0")' metadata.json
          test -s docs/packaging/releases/v2.0.0.md
          bash -n scripts/package-linux.sh

  windows-x64:
    needs: validate
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the v2.0.0 source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Install stable Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Build release binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --locked --release --target x86_64-pc-windows-msvc -p shell -p cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path package | Out-Null
          python scripts/build-vim.py --output package/vim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/x86_64-pc-windows-msvc/release/tundra-shell.exe package/
          Copy-Item target/x86_64-pc-windows-msvc/release/tundra-cli.exe package/
          Copy-Item -Recurse crates/ascii-assets/assets package/assets
          foreach ($locale in @("en-US", "zh-CN")) {
            if (!(Test-Path "package/assets/locales/$locale/manifest.toml")) {
              throw "Missing packaged locale: $locale"
            }
          }
          Copy-Item LICENSE package/
          Copy-Item crates/weathr/LICENSE.weathr package/
          Copy-Item third_party/opencode/LICENSE package/LICENSE.opencode
          Compress-Archive -Path package/* -DestinationPath TundraUX-v2.0.0-windows-x64.zip
          $hash = (Get-FileHash TundraUX-v2.0.0-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TundraUX-v2.0.0-windows-x64.zip" |
            Out-File TundraUX-v2.0.0-windows-x64.sha256 -Encoding ascii
          Get-Item package/* | Format-Table Name,Length

      - name: Stage Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: |
            TundraUX-v2.0.0-windows-x64.zip
            TundraUX-v2.0.0-windows-x64.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  macos-arm64:
    needs: validate
    name: macOS Apple Silicon
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out the v2.0.0 source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Rust and native image libraries
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-apple-darwin
          brew install cairo pixman

      - name: Build ARM64 release binaries and Vim
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target aarch64-apple-darwin -p shell -p cli
          python3 scripts/build-vim.py --output package/vim

      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          cp target/aarch64-apple-darwin/release/tundra-shell package/
          cp target/aarch64-apple-darwin/release/tundra-cli package/
          cp -R crates/ascii-assets/assets package/assets
          for locale in en-US zh-CN; do
            test -s "package/assets/locales/$locale/manifest.toml"
          done
          cp LICENSE package/
          cp crates/weathr/LICENSE.weathr package/
          cp third_party/opencode/LICENSE package/LICENSE.opencode
          for binary in package/tundra-shell package/tundra-cli package/vim/vim; do
            test "$(lipo -archs "$binary")" = arm64
          done
          python3 scripts/build-vim.py --verify-only --output package/vim
          tar -C package -czf TundraUX-v2.0.0-macos-arm64.tar.gz \
            tundra-shell tundra-cli assets vim LICENSE LICENSE.weathr LICENSE.opencode
          shasum -a 256 TundraUX-v2.0.0-macos-arm64.tar.gz \
            > TundraUX-v2.0.0-macos-arm64.sha256

      - name: Stage macOS release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: |
            TundraUX-v2.0.0-macos-arm64.tar.gz
            TundraUX-v2.0.0-macos-arm64.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  linux-x64:
    needs: validate
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the v2.0.0 source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build Linux portable archive
        shell: bash
        env:
          TUNDRAUX_VERSION: 2.0.0
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libncurses-dev
          python3 scripts/build-vim.py --output target/release/vim
          bash scripts/package-linux.sh --tar-only
          mv dist/tundraux-2.0.0-linux-x86_64.tar.gz \
            dist/TundraUX-v2.0.0-linux-x86_64.tar.gz
          cd dist
          sha256sum \
            TundraUX-v2.0.0-linux-x86_64.tar.gz \
            > TundraUX-v2.0.0-linux-x86_64.sha256

      - name: Stage Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: |
            dist/TundraUX-v2.0.0-linux-x86_64.tar.gz
            dist/TundraUX-v2.0.0-linux-x86_64.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [windows-x64, macos-arm64, linux-x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - name: Download verified build assets
        uses: actions/download-artifact@v8
        with:
          name: release-windows-x64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-macos-arm64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-linux-x64
          path: dist
      - name: Verify staged checksums and exact asset set
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for asset in \
            windows-x64.zip windows-x64.sha256 \
            macos-arm64.tar.gz macos-arm64.sha256 \
            linux-x86_64.tar.gz linux-x86_64.sha256; do
            test -s "TundraUX-v2.0.0-$asset"
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done
      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          cp docs/packaging/releases/v2.0.0.md release-notes.md
          printf '\n构建提交：`%s`。\n' "$RELEASE_REF" >> release-notes.md
      - name: Upload and verify draft before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_REF" --draft \
              --repo "$GITHUB_REPOSITORY" --title V2.0.0 --notes-file release-notes.md
          fi
          # A published tag must never be moved or replaced on a rerun.
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')" = "$RELEASE_REF"
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | [.name, .digest] | @tsv' > remote-digests.tsv
          test "$(wc -l < remote-digests.tsv)" -eq 6
          for asset in dist/*; do
            name="$(basename "$asset")"
            digest="sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
            grep -Fqx "$(printf '%s\t%s' "$name" "$digest")" remote-digests.tsv
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_REF" --title V2.0.0 --notes-file release-notes.md --draft=false --latest
      - name: Verify published release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,publishedAt,url,assets > release.json
          jq -e '.tagName == "v2.0.0" and .name == "V2.0.0" and .isDraft == false and .isPrerelease == false and (.assets | length == 6)' release.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')" = "$RELEASE_REF"
          cat release.json
