[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
i18n = { path = "../i18n" }
runtime-log = { path = "../runtime-log" }
bytemuck = { version = "1.25", features = ["alloc_uninit", "extern_crate_alloc", "zeroable_maybe_uninit"] }
chrono = "0.4"
chrono-tz = "0.10"
comrak = { version = "0.54", default-features = false }
hayro = "0.9"
memchr = "2"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
png = "0.18"
regex = "1"
shell-words = "1.1"
lsh = { path = "../../third_party/lsh", default-features = false, features = ["glob"] }
office_oxide = { package = "tundra-office-reader", path = "../../third_party/office-reader", default-features = false }
ropey = { version = "1.6", default-features = false, features = ["cr_lines", "simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ascii-assets = { path = "../ascii-assets" }
identity = { path = "../identity" }
platform = { path = "../platform" }
storage = { path = "../storage" }
watchdog = { path = "../watchdog" }
workspace-protocol = { path = "../workspace-protocol" }
unicode-segmentation = "1.12"
unicode-width = "0.2"
time = { version = "2.0.0", path = "../time" }
system-services = { path = "../system-services", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "hickory-dns"] }
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
semver = "1"
toml = "0.9"
zip = { version = "6", default-features = false, features = ["deflate"] }
archive-zip = { package = "zip", version = "9.7", default-features = false, features = ["aes-crypto", "deflate"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "compress", "deflate", "bzip2", "ppmd"] }
rars = { version = "0.12", default-features = false, features = ["encryption", "write"] }
flate2 = "1"
tar = "0.4"
tempfile = "3"

[dev-dependencies]
watchdog = { path = "../watchdog", features = ["test-support"] }

[build-dependencies]
lsh = { path = "../../third_party/lsh", default-features = false, features = ["compiler"] }
